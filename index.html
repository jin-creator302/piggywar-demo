<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>저금전쟁 — 곰(갑옷)+효과음 데모</title>
<style>
  :root{
    --bg:#eaf7ef; --card:#fff; --accent:#f6c94d; --muted:#6a7672; --primary:#6aa84f;
    --brown:#5a3b2b; --gold:#e9c55a; --steel:#c7d2da; --steel-dark:#9aa7b1;
    font-family: Inter, "Noto Sans KR", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#dff0e9);}
  .app{max-width:420px;margin:10px auto;padding:12px;box-sizing:border-box;}
  header{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .status{display:flex;gap:8px;align-items:center;}
  .stat{background:var(--card);padding:8px 12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:flex-start;}
  .stat small{color:var(--muted);font-size:11px}
  .big{font-weight:700;font-size:18px}
  .main{background:rgba(255,255,255,.85);border-radius:16px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.06);}
  .battle-area{height:320px;border-radius:12px;background:
    radial-gradient(circle at 20% 60%, #d6f0c6 0%, transparent 10%),
    linear-gradient(180deg,#bfe8b7,#9fd79a);
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .hills{position:absolute;left:0;right:0;bottom:0;height:40%;background:
    linear-gradient(180deg,#9fd79a,#7fb67f);border-radius:20px 20px 0 0;opacity:.9;}
  /* ----- 곰(갑옷) ----- */
  .bear-wrap{position:relative; width:134px; height:136px; transform:translateY(8px);}
  .bear{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .bear-body{position:absolute; bottom:8px; left:22px; width:90px; height:86px; background:#8d6449; border-radius:38px; box-shadow:0 6px 0 rgba(0,0,0,.06)}
  .bear-head{position:absolute; top:10px; left:17px; width:100px; height:95px; background:#a2795b; border-radius:42px; box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
  .ear{position:absolute; width:28px; height:28px; background:#a2795b; border-radius:50%}
  .ear.left{top:2px; left:8px}
  .ear.right{top:0px; right:10px}
  .ear-inner{position:absolute; inset:6px; background:#c39c7c; border-radius:50%}
  .face{position:absolute; top:36px; left:24px; width:52px; height:36px; background:#d9b9a1; border-radius:16px}
  .eye{position:absolute; width:9px; height:9px; background:var(--brown); border-radius:50%}
  .eye.left{top:20px; left:26px}
  .eye.right{top:20px; right:26px}
  .nose{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:16px; height:12px; background:var(--brown); border-radius:12px}
  .mouth{position:absolute; top:22px; left:50%; transform:translateX(-50%); width:26px; height:10px; border-bottom:4px solid var(--brown); border-radius:0 0 12px 12px}
  /* 갑옷 */
  .armor-helmet{position:absolute; top:4px; left:14px; width:106px; height:40px; background:linear-gradient(180deg,var(--steel),var(--steel-dark)); border-radius:18px 18px 10px 10px; box-shadow:0 2px 0 rgba(0,0,0,.1)}
  .armor-plate{position:absolute; bottom:18px; left:30px; width:76px; height:44px; background:linear-gradient(180deg,var(--steel),var(--steel-dark)); border-radius:10px; box-shadow:0 2px 0 rgba(0,0,0,.1)}
  .crest{position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:18px; height:18px; background:var(--gold); border-radius:50%; box-shadow:0 0 0 3px rgba(255,255,255,.5) inset}
  .strap{position:absolute; bottom:-6px; left:0; right:0; height:10px; background:rgba(0,0,0,.1); border-radius:0 0 10px 10px}
  /* 상호작용 효과 */
  .tappable{touch-action:manipulation; cursor:pointer}
  .tap-bounce{animation:tapBounce .25s ease}
  @keyframes tapBounce{
    0%{transform:translateY(8px) scale(1);}
    50%{transform:translateY(3px) scale(1.04);}
    100%{transform:translateY(8px) scale(1);}
  }
  .spark{
    position:absolute; width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle,#fff 0%, #ffe9a8 50%, rgba(255,255,255,0) 70%);
    animation:spark .6s ease-out forwards; pointer-events:none;
  }
  @keyframes spark{
    0%{opacity:.95; transform:translate(0,0) scale(.6)}
    100%{opacity:0; transform:translate(var(--dx,10px),var(--dy,-18px)) scale(1.6)}
  }
  .enemy-row{position:absolute; right:18px; top:24px; display:flex; gap:8px; transform:scale(.9)}
  .enemy{width:54px; height:54px; border-radius:12px; background:linear-gradient(180deg,#ffd7a8,#ffb37a); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,.06)}
  .treasure{position:absolute; left:18px; bottom:18px; width:64px; height:48px; border-radius:8px; background:linear-gradient(180deg,#f6c94d,#e3a61f); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff}
  .controls{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  button{flex:1; padding:12px; border-radius:12px; border:0; background:var(--primary); color:#fff; font-weight:700; box-shadow:0 6px 12px rgba(0,0,0,.08); font-size:15px}
  button.secondary{background:#fff;color:var(--muted);border:1px solid #eee}
  .log{margin-top:10px;font-size:13px;color:#334;padding:10px;border-radius:10px;background:rgba(255,255,255,.9);min-height:52px}
  .upgrade-row{display:flex;gap:8px;margin-top:10px;}
  .upgrade{flex:1;background:linear-gradient(180deg,#fff,#f7f7f7);padding:8px;border-radius:12px;text-align:center}
  .small{font-size:12px;color:var(--muted)}
  footer{margin-top:8px;text-align:center;color:var(--muted);font-size:12px}
  @media (max-width:420px){
    .battle-area{height:58vh}
  }
</style>
</head>
<body>
<div class="app" role="application" aria-label="저금전쟁 곰 데모">
  <header>
    <div class="status">
      <div class="stat"><small>지갑</small><div class="big" id="wallet">0G</div></div>
      <div class="stat"><small>금고</small><div class="big" id="bank">0G</div></div>
    </div>
    <div class="stat" style="text-align:right"><small>이자율</small><div class="big" id="rate">+5% / 15s</div></div>
  </header>

  <main class="main">
    <div class="battle-area" id="stage">
      <div class="hills"></div>

      <div class="enemy-row" id="enemies"></div>

      <!-- 곰 캐릭터 -->
      <div class="bear-wrap tappable" id="hero" aria-label="곰 캐릭터 버튼" role="button">
        <div class="bear">
          <div class="bear-body"></div>
          <div class="bear-head"></div>
          <div class="ear left"><div class="ear-inner"></div></div>
          <div class="ear right"><div class="ear-inner"></div></div>
          <div class="face"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
          <div class="mouth"></div>

          <div class="armor-helmet">
            <div class="crest"></div>
          </div>
          <div class="armor-plate">
            <div class="strap"></div>
          </div>
        </div>
      </div>

      <div class="treasure" id="treasure">☆</div>
    </div>

    <div class="controls">
      <button id="fightBtn">전투 시작</button>
      <button id="autoBtn" class="secondary">자동전투: OFF</button>
      <button id="depositBtn" class="secondary">저금하기</button>
    </div>

    <div class="upgrade-row">
      <div class="upgrade">
        <div class="small">공격력</div>
        <div id="atkStat" style="font-weight:700">1</div>
        <button id="buyAtk" style="margin-top:8px;padding:8px;border-radius:8px;background:#ffe0b2;border:0;color:#5a3b2b;font-weight:700">업그레이드 (50G)</button>
      </div>
      <div class="upgrade">
        <div class="small">금고 수준</div>
        <div id="bankLv" style="font-weight:700">1</div>
        <button id="upgradeBank" style="margin-top:8px;padding:8px;border-radius:8px;background:#dff0e9;border:0;color:#2f6f3f;font-weight:700">업그레이드(120G)</button>
      </div>
    </div>

    <div class="log" id="log">환영합니다, 사령관님! 곰을 눌러 “우엉~”을 들어보고, 전투→저금 루프를 체험해보세요.</div>
  </main>

  <footer>데모: 전투 → 보상 → 저축 루프 + 코믹 효과음</footer>
</div>

<script>
/* =======================
   오디오(웹오디오) - 코믹 “우엉~”, 타격 “퍽!”
   ======================= */
let audioCtx;
function getCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
  }
  return audioCtx;
}
// 코믹 “우엉~”: 저음 글라이드 + 비브라토
function playWoong(){
  const ctx = getCtx();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180, ctx.currentTime);
  // 살짝 아래로 미끄러지듯
  o.frequency.exponentialRampToValueAtTime(95, ctx.currentTime + 0.35);
  // 비브라토
  const lfo = ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=6;
  const lfoGain = ctx.createGain(); lfoGain.gain.value = 8;
  lfo.connect(lfoGain).connect(o.frequency);

  g.gain.setValueAtTime(0.001, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.5, ctx.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);

  o.connect(g).connect(ctx.destination);
  o.start(); lfo.start();
  o.stop(ctx.currentTime + 0.52); lfo.stop(ctx.currentTime + 0.52);
}
// 타격 “퍽!”: 킥+노이즈 섞기
function playThump(){
  const ctx = getCtx();
  // 킥(저음)
  const kick = ctx.createOscillator(); kick.type = 'sine';
  const kg = ctx.createGain(); kg.gain.value = 0.0001;
  kick.frequency.setValueAtTime(180, ctx.currentTime);
  kick.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.15);
  kg.gain.exponentialRampToValueAtTime(0.6, ctx.currentTime + 0.01);
  kg.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
  kick.connect(kg).connect(ctx.destination);
  kick.start(); kick.stop(ctx.currentTime + 0.22);

  // 짧은 노이즈(어택)
  const bufferSize = 0.08 * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
  const noise = ctx.createBufferSource(); noise.buffer = buffer;
  const ng = ctx.createGain(); ng.gain.value = 0.6;
  noise.connect(ng).connect(ctx.destination);
  noise.start(); noise.stop(ctx.currentTime + 0.08);
}

/* =======================
   상태 & 유틸
   ======================= */
const state = {
  wallet: 200, bank: 0, atk: 1, bankLv: 1,
  interestRate: 0.05, interestIntervalSec: 15,
  autoFight: false
};
const $ = id => document.getElementById(id);
function loadState(){
  const saved = localStorage.getItem('saving_war_bear_v1');
  if(saved) { try{ Object.assign(state, JSON.parse(saved)); }catch(e){} }
}
function saveState(){
  const copy = {wallet:state.wallet,bank:state.bank,atk:state.atk,bankLv:state.bankLv,
    interestRate:state.interestRate,interestIntervalSec:state.interestIntervalSec,autoFight:state.autoFight};
  localStorage.setItem('saving_war_bear_v1', JSON.stringify(copy));
}
function render(){
  $('wallet').textContent = Math.round(state.wallet) + 'G';
  $('bank').textContent = Math.round(state.bank) + 'G';
  $('atkStat').textContent = state.atk;
  $('bankLv').textContent = state.bankLv;
  $('rate').textContent = `+${Math.round(state.interestRate*100)}% / ${state.interestIntervalSec}s`;
  $('autoBtn').textContent = state.autoFight ? '자동전투: ON' : '자동전투: OFF';
}
function log(msg){
  $('log').textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
}
function spark(x,y){
  const s = document.createElement('div');
  s.className = 'spark';
  s.style.left = x + 'px';
  s.style.top = y + 'px';
  const dx = (Math.random()*24-12) + 'px';
  const dy = (-14 - Math.random()*10) + 'px';
  s.style.setProperty('--dx', dx);
  s.style.setProperty('--dy', dy);
  $('stage').appendChild(s);
  setTimeout(()=>s.remove(), 650);
}

/* =======================
   전투/경제 로직
   ======================= */
function spawnEnemies(count=4){
  const row = $('enemies');
  row.innerHTML = '';
  for(let i=0;i<count;i++){
    const e = document.createElement('div');
    e.className = 'enemy'; e.textContent = '✦';
    row.appendChild(e);
  }
}
function animateTreasure(){
  const t = $('treasure');
  t.animate([{transform:'translateY(0px)'},{transform:'translateY(-8px)'},{transform:'translateY(0px)'}],{duration:700,iterations:1});
}
function heroTapFx(){
  const hero = $('hero');
  hero.classList.remove('tap-bounce'); void hero.offsetWidth; // reflow
  hero.classList.add('tap-bounce');
  // 스파크 몇 개
  const rect = hero.getBoundingClientRect();
  for(let i=0;i<4;i++){
    spark(rect.left + rect.width/2 + (Math.random()*30-15), rect.top + rect.height/2 + (Math.random()*20-10));
  }
}
function fight(){
  // 타격 사운드(선타)
  playThump();

  const basePower = state.atk * (1 + state.bankLv * 0.05);
  const bankInfluence = Math.sqrt(state.bank) / 50;
  const playerPower = basePower * (1 + bankInfluence);
  const enemyPower = 1 + Math.random()*3 + Math.random()*state.bankLv;
  const loot = Math.round(40 + Math.random()*80 + state.bankLv*10);
  const winChance = playerPower / (playerPower + enemyPower);
  const didWin = Math.random() < winChance;

  if(didWin){
    state.wallet += loot;
    log(`승리! 전리품 ${loot}G 획득. (승률 ${(winChance*100).toFixed(0)}%)`);
  } else {
    const lost = Math.round(Math.min(state.wallet, 20 + Math.random()*50));
    state.wallet -= lost;
    if(Math.random() < 0.08){
      const steal = Math.round(Math.min(state.bank, 10 + Math.random()*30));
      state.bank -= steal;
      log(`패배... 지갑 -${lost}G, 금고에서 -${steal}G(도난).`);
    } else {
      log(`패배... 지갑 -${lost}G (승률 ${(winChance*100).toFixed(0)}%)`);
    }
  }

  saveState(); render(); spawnEnemies(Math.max(1, Math.round(2 + Math.random()*4))); animateTreasure();
}
function depositAll(){
  const amount = Math.max(0, Math.floor(prompt('얼마를 저금하시겠어요? (숫자 입력)', Math.max(0, Math.round(state.wallet/2))) || 0));
  if(amount <= 0){ log('저금 취소'); return; }
  if(amount > state.wallet){ log('지갑 잔액 부족'); return; }
  state.wallet -= amount; state.bank += amount;
  log(`${amount}G 저금 완료!`);
  saveState(); render();
}
function buyAtk(){
  const cost = 50 + state.atk * 20;
  if(state.wallet < cost){ log('지갑 잔액이 부족합니다.'); return; }
  state.wallet -= cost; state.atk += 1;
  log(`공격력 +1 (지불 ${cost}G)`);
  saveState(); render();
}
function upgradeBank(){
  const cost = 120 + (state.bankLv-1)*80;
  if(state.wallet < cost){ log('지갑 잔액이 부족합니다.'); return; }
  state.wallet -= cost; state.bankLv += 1; state.interestRate += 0.02;
  log(`금고 업그레이드! 레벨 ${state.bankLv}, 이자율 상승`);
  saveState(); render();
}
let interestTimer=null, autoTimer=null;
function startInterestTimer(){
  if(interestTimer) clearInterval(interestTimer);
  interestTimer = setInterval(()=>{
    const gain = Math.floor(state.bank * state.interestRate);
    if(gain > 0){
      state.bank += gain;
      log(`이자 지급: +${gain}G`);
      saveState(); render();
    }
  }, state.interestIntervalSec*1000);
}
function toggleAuto(){
  state.autoFight = !state.autoFight;
  if(state.autoFight){
    autoTimer = setInterval(()=> fight(), 4000);
    log('자동전투 ON');
  } else {
    if(autoTimer) clearInterval(autoTimer);
    log('자동전투 OFF');
  }
  saveState(); render();
}

/* =======================
   초기화 & 이벤트
   ======================= */
function init(){
  loadState(); render(); spawnEnemies(4); startInterestTimer();
  $('fightBtn').addEventListener('click', fight);
  $('depositBtn').addEventListener('click', depositAll);
  $('buyAtk').addEventListener('click', buyAtk);
  $('upgradeBank').addEventListener('click', upgradeBank);
  $('autoBtn').addEventListener('click', toggleAuto);

  // 곰 탭: “우엉~” + 바운스 + 스파크
  const hero = $('hero');
  const tap = (e)=>{ playWoong(); heroTapFx(); };
  hero.addEventListener('click', tap);
  hero.addEventListener('touchstart', tap, {passive:true});

  // iOS 오디오 정책 대비: 첫 사용자 제스처 이후 컨텍스트 재개
  window.addEventListener('pointerdown', ()=>{ if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); } }, {once:false});
  // 가이드 메시지
  setTimeout(()=>log('전투로 보상 획득 → 지갑 또는 금고에 저금해 보세요. 곰을 눌러 “우엉~”도 들어보기!'),800);
}
init();
</script>
</body>
</html>
