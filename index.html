<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>저금전쟁 — 프로토타입</title>
<style>
  :root{
    --bg:#eaf7ef; --card:#fff; --accent:#f6c94d; --muted:#7a8b86; --primary:#6aa84f;
    font-family: Inter, "Noto Sans KR", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#dff0e9);}
  .app{max-width:420px;margin:10px auto;padding:12px;box-sizing:border-box;}
  header{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .status{display:flex;gap:8px;align-items:center;}
  .stat{background:var(--card);padding:8px 12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:flex-start;}
  .stat small{color:var(--muted);font-size:11px}
  .big{font-weight:700;font-size:18px}
  .main{background:rgba(255,255,255,.85);border-radius:16px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.06);}
  .battle-area{height:320px;border-radius:12px;background:
    radial-gradient(circle at 20% 60%, #d6f0c6 0%, transparent 10%),
    linear-gradient(180deg,#bfe8b7,#9fd79a);
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .hills{position:absolute;left:0;right:0;bottom:0;height:40%;background:
    linear-gradient(180deg,#9fd79a,#7fb67f);border-radius:20px 20px 0 0;opacity:.9;}
  .cat{width:110px;height:110px;border-radius:24px;background:linear-gradient(180deg,#f7c9b8,#ef9b82);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.06);transform:translateY(10px);}
  .cat .face{width:84px;height:84px;border-radius:20px;background:linear-gradient(180deg,#ffd5c0,#ffb28a);display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .eyes{display:flex;gap:10px;margin-bottom:6px}
  .eye{width:10px;height:10px;background:#5a3b2b;border-radius:50%}
  .mouth{width:28px;height:10px;border-radius:10px;background:#5a3b2b}
  .enemy-row{position:absolute;right:18px;top:24px;display:flex;gap:8px;transform:scale(.9)}
  .enemy{width:54px;height:54px;border-radius:12px;background:linear-gradient(180deg,#ffd7a8,#ffb37a);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.06)}
  .treasure{position:absolute;left:18px;bottom:18px;width:64px;height:48px;border-radius:8px;background:linear-gradient(180deg,#f6c94d,#e3a61f);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
  .controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  button{flex:1;padding:12px;border-radius:12px;border:0;background:var(--primary);color:#fff;font-weight:700;box-shadow:0 6px 12px rgba(0,0,0,.08);font-size:15px}
  button.secondary{background:#fff;color:var(--muted);border:1px solid #eee}
  .log{margin-top:10px;font-size:13px;color:#334;padding:10px;border-radius:10px;background:rgba(255,255,255,.9);min-height:52px}
  .upgrade-row{display:flex;gap:8px;margin-top:10px;}
  .upgrade{flex:1;background:linear-gradient(180deg,#fff,#f7f7f7);padding:8px;border-radius:12px;text-align:center}
  .small{font-size:12px;color:var(--muted)}
  footer{margin-top:8px;text-align:center;color:var(--muted);font-size:12px}
  @media (max-width:420px){
    .battle-area{height:58vh}
  }
</style>
</head>
<body>
<div class="app" role="application" aria-label="저금전쟁 프로토타입">
  <header>
    <div class="status">
      <div class="stat" id="walletStat"><small>지갑</small><div class="big" id="wallet">0G</div></div>
      <div class="stat" id="bankStat"><small>금고</small><div class="big" id="bank">0G</div></div>
    </div>
    <div class="stat" style="text-align:right"><small>이자율</small><div class="big" id="rate">+5% / 15s</div></div>
  </header>

  <main class="main">
    <div class="battle-area" id="stage">
      <div class="hills"></div>

      <div class="enemy-row" id="enemies"></div>

      <div class="cat" aria-hidden="true" id="hero">
        <div class="face">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
      </div>

      <div class="treasure" id="treasure">☆</div>
    </div>

    <div class="controls">
      <button id="fightBtn">전투 시작</button>
      <button id="autoBtn" class="secondary">자동전투: OFF</button>
      <button id="depositBtn" class="secondary">저금하기</button>
    </div>

    <div class="upgrade-row">
      <div class="upgrade">
        <div class="small">공격력</div>
        <div id="atkStat" style="font-weight:700">1</div>
        <button id="buyAtk" style="margin-top:8px;padding:8px;border-radius:8px;background:#ffe0b2;border:0;color:#5a3b2b;font-weight:700">업그레이드 (50G)</button>
      </div>
      <div class="upgrade">
        <div class="small">금고 수준</div>
        <div id="bankLv" style="font-weight:700">1</div>
        <button id="upgradeBank" style="margin-top:8px;padding:8px;border-radius:8px;background:#dff0e9;border:0;color:#2f6f3f;font-weight:700">업그레이드(120G)</button>
      </div>
    </div>

    <div class="log" id="log">환영합니다, 사령관님! 전투로 금화를 모으고 금고에 저금해 보세요.</div>
  </main>

  <footer>데모: 전투 → 보상 → 저축 루프(로컬 저장)</footer>
</div>

<script>
/*
  간단 설명:
  - wallet: 즉시 사용 가능한 동전
  - bank: 저축(은행). 일정 주기마다 이자 증가(데모용 빠른 주기)
  - fight(): 전투를 판정하고 보상을 줌
  - deposit(): wallet -> bank로 이체
  - autoFight: ON이면 일정 간격 자동 전투
  - 로컬저장: wallet, bank, atk, bankLv persist
*/

const state = {
  wallet: 200,
  bank: 0,
  atk: 1,
  bankLv: 1,
  interestRate: 0.05, // 기본 5%
  interestIntervalSec: 15, // 데모용: 15초마다 이자
  autoFight: false,
  logElem: null
};

const $ = id => document.getElementById(id);

function loadState(){
  const saved = localStorage.getItem('saving_war_v1');
  if(saved) {
    try{
      const s = JSON.parse(saved);
      Object.assign(state, s);
    }catch(e){}
  }
}
function saveState(){
  const copy = {wallet:state.wallet,bank:state.bank,atk:state.atk,bankLv:state.bankLv,interestRate:state.interestRate,interestIntervalSec:state.interestIntervalSec,autoFight:state.autoFight};
  localStorage.setItem('saving_war_v1', JSON.stringify(copy));
}

function render(){
  $('wallet').textContent = Math.round(state.wallet) + 'G';
  $('bank').textContent = Math.round(state.bank) + 'G';
  $('atkStat').textContent = state.atk;
  $('bankLv').textContent = state.bankLv;
  $('rate').textContent = `+${Math.round(state.interestRate*100)}% / ${state.interestIntervalSec}s`;
  $('autoBtn').textContent = state.autoFight ? '자동전투: ON' : '자동전투: OFF';
}

function log(msg){
  const el = $('log');
  const time = new Date().toLocaleTimeString();
  el.textContent = `[${time}] ${msg}`;
}

function spawnEnemies(count=4){
  const row = $('enemies');
  row.innerHTML = '';
  for(let i=0;i<count;i++){
    const e = document.createElement('div');
    e.className = 'enemy';
    e.textContent = '✦';
    row.appendChild(e);
  }
}

function fight(){
  // 전투 판정 : 플레이어 전투력 = atk * (1 + bankLv*0.05) + bankBoost
  const basePower = state.atk * (1 + state.bankLv * 0.05);
  // 금고에 일정 비율이 있으면 '사기' 보너스: bankInfluence = sqrt(bank)/50 (소수점)
  const bankInfluence = Math.sqrt(state.bank) / 50;
  const playerPower = basePower * (1 + bankInfluence);

  // 적 전투력 랜덤
  const enemyPower = 1 + Math.random()*3 + Math.random()*state.bankLv;

  // 전리품: 기본 40~120G, 승리시 보너스 + bankLv*10
  const loot = Math.round(40 + Math.random()*80 + state.bankLv*10);

  // 판정 가중치
  const winChance = playerPower / (playerPower + enemyPower);
  const didWin = Math.random() < winChance;

  if(didWin){
    state.wallet += loot;
    log(`승리! 전리품 ${loot}G 획득. (승률 ${(winChance*100).toFixed(0)}%)`);
  } else {
    // 패배하면 일부 지갑 손실 + 드문 경우 금고 약탈(작은 비율)
    const lost = Math.round(Math.min(state.wallet, 20 + Math.random()*50));
    state.wallet -= lost;
    // 금고 약탈 확률: 8% * (적 난도) -> 데모에선 낮게
    if(Math.random() < 0.08){
      const steal = Math.round(Math.min(state.bank, 10 + Math.random()*30));
      state.bank -= steal;
      log(`패배... 지갑 -${lost}G, 금고에서 -${steal}G(도난).`);
    } else {
      log(`패배... 지갑 -${lost}G (승률 ${(winChance*100).toFixed(0)}%)`);
    }
  }

  saveState();
  render();
  spawnEnemies(Math.max(1, Math.round(2 + Math.random()*4)));
  animateTreasure();
}

function animateTreasure(){
  const t = $('treasure');
  t.animate([{transform:'translateY(0px)'},{transform:'translateY(-8px)'},{transform:'translateY(0px)'}],{duration:700,iterations:1});
}

function depositAll(){
  // 지갑의 일부 또는 전부를 금고로 보낼 수 있게 간단한 UI prompt
  const amount = Math.max(0, Math.floor(prompt('얼마를 저금하시겠어요? (숫자 입력)', Math.max(0, Math.round(state.wallet/2))) || 0));
  if(amount <= 0) { log('저금 취소'); return; }
  if(amount > state.wallet){ log('지갑 잔액 부족'); return; }
  state.wallet -= amount;
  state.bank += amount;
  log(`${amount}G 저금 완료!`);
  saveState();
  render();
}

function buyAtk(){
  const cost = 50 + state.atk * 20;
  if(state.wallet < cost){ log('지갑 잔액이 부족합니다.'); return; }
  state.wallet -= cost;
  state.atk += 1;
  log(`공격력 +1 구매 (지불 ${cost}G).`);
  saveState(); render();
}

function upgradeBank(){
  const cost = 120 + (state.bankLv-1)*80;
  if(state.wallet < cost){ log('지갑 잔액이 부족합니다.'); return; }
  state.wallet -= cost;
  state.bankLv += 1;
  // 은행 레벨이 오르면 이자율 소폭 증가
  state.interestRate += 0.02;
  log(`금고 업그레이드! 이제 레벨 ${state.bankLv}, 이자율 상승.`);
  saveState(); render();
}

let interestTimer = null;
function startInterestTimer(){
  if(interestTimer) clearInterval(interestTimer);
  interestTimer = setInterval(()=>{
    // 이자 적용: bank += floor(bank * interestRate)
    const gain = Math.floor(state.bank * state.interestRate);
    if(gain > 0){
      state.bank += gain;
      log(`이자 지급: +${gain}G (금고)`);
      saveState(); render();
    } else {
      // 소액 보너스: 소액이 금고에 있으면 고정 소액 지급(데모용)
      if(state.bank >= 10){
        const micro = 1;
        state.bank += micro;
        saveState(); render();
      }
    }
  }, state.interestIntervalSec * 1000);
}

let autoTimer = null;
function toggleAuto(){
  state.autoFight = !state.autoFight;
  if(state.autoFight){
    autoTimer = setInterval(()=>{ fight(); }, 4000); // 4초마다 자동전투
    log('자동전투 ON');
  } else {
    if(autoTimer) clearInterval(autoTimer);
    log('자동전투 OFF');
  }
  saveState(); render();
}

/* 작은 시각 효과: enemy spawn, hero bounce */
function heroBounce(){
  const hero = $('hero');
  hero.animate([{transform:'translateY(10px)'},{transform:'translateY(-8px)'},{transform:'translateY(10px)'}],{duration:900,iterations:1});
}

/* 초기화 */
function init(){
  loadState();
  // 기본 초기화 값 보정
  if(typeof state.wallet !== 'number') state.wallet = 200;
  if(typeof state.bank !== 'number') state.bank = 0;
  if(typeof state.atk !== 'number') state.atk = 1;
  if(typeof state.bankLv !== 'number') state.bankLv = 1;
  // bind
  $('fightBtn').addEventListener('click', ()=>{ fight(); heroBounce(); });
  $('depositBtn').addEventListener('click', depositAll);
  $('buyAtk').addEventListener('click', buyAtk);
  $('upgradeBank').addEventListener('click', upgradeBank);
  $('autoBtn').addEventListener('click', toggleAuto);

  spawnEnemies(4);
  render();
  startInterestTimer();

  // 자동전투가 저장상태라면 재시작
  if(state.autoFight) toggleAuto();

  // 데모 시작 메시지
  setTimeout(()=>log('전투 버튼을 눌러서 보상 획득 → 지갑 또는 금고에 저장해 보세요.'),800);
}
init();

</script>
</body>
</html>
